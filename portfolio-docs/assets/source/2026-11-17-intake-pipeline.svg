<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 250" role="img" aria-labelledby="title desc">
<title id="title">Privacy policy intake and decomposition pipeline</title><desc id="desc">Catalog, URL, pasted text, and files feed a common source record. Exact units with headings and offsets feed a model that proposes claims. Citation validation checks quotes and context; unverified paraphrases and warnings remain visible.</desc>
<rect width="1080" height="250" fill="#f5f4ee"/>
<g font-family="Arial, sans-serif" fill="#254b3c"><text x="26" y="37" font-size="22" font-weight="700">From policy source to reviewable draft claims</text><text x="26" y="62" font-size="13">Exact source text stays authoritative throughout the pipeline</text></g>
<g fill="#fffefa" stroke="#cfd8c8" stroke-width="2"><rect x="25" y="86" width="190" height="112" rx="13"/><rect x="252" y="86" width="190" height="112" rx="13"/><rect x="479" y="86" width="190" height="112" rx="13"/><rect x="706" y="86" width="190" height="112" rx="13"/><rect x="933" y="86" width="122" height="112" rx="13"/></g>
<g font-family="Arial, sans-serif" fill="#254b3c"><text x="43" y="116" font-size="16" font-weight="700">Input</text><text x="43" y="140" font-size="12">Catalog · URL · paste</text><text x="43" y="158" font-size="12">TXT · RTF · DOCX · PDF</text><text x="270" y="116" font-size="16" font-weight="700">Source record</text><text x="270" y="140" font-size="12">Text · origin · date</text><text x="270" y="158" font-size="12">Extraction warnings</text><text x="497" y="116" font-size="16" font-weight="700">Exact units</text><text x="497" y="140" font-size="12">Offsets · headings</text><text x="497" y="158" font-size="12">Neighbor context</text><text x="724" y="116" font-size="16" font-weight="700">Model proposals</text><text x="724" y="140" font-size="12">Claims · source quotes</text><text x="724" y="158" font-size="12">Context quotes</text><text x="951" y="116" font-size="16" font-weight="700">Checks</text><text x="951" y="140" font-size="12">Exact range</text><text x="951" y="158" font-size="12">Review flags</text></g>
<g stroke="#6b8a67" stroke-width="3" fill="none"><path d="M216 142h30m-8-7 8 7-8 7M443 142h30m-8-7 8 7-8 7M670 142h30m-8-7 8 7-8 7M897 142h30m-8-7 8 7-8 7"/></g>
<text x="27" y="226" font-family="Arial, sans-serif" font-size="12" fill="#6d756c">A matching quote proves source location. It does not prove the paraphrase preserves meaning.</text>
</svg>
