<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="570" viewBox="0 0 1400 570">
<rect width="1400" height="570" fill="#f6f4ef"/>
<style>text{font-family:Arial,sans-serif;fill:#182d39}.k{font-size:15px;letter-spacing:2px;fill:#446d77}.h{font-size:23px;font-weight:bold}.b{font-size:18px}</style>
<text x="55" y="57" class="k">PORTFOLIO PROCESS NOTE · 12 NOV 2026</text>
<text x="55" y="110" font-size="34" font-weight="bold">Privacy review: from policy to personal questions</text>
<rect x="55" y="174" width="237" height="270" rx="15" fill="white" stroke="#cbd7d8"/>
<text x="75" y="211" class="k">01</text>
<text x="75" y="250" class="h">Set priorities</text>
<text x="75" y="321" class="b">Explicit, editable</text>
<text x="75" y="346" class="b">concerns help order</text>
<text x="75" y="371" class="b">attention without</text>
<text x="75" y="396" class="b">hiding information.</text>
<text x="297" y="300" font-size="25">→</text>
<rect x="318" y="174" width="237" height="270" rx="15" fill="white" stroke="#cbd7d8"/>
<text x="338" y="211" class="k">02</text>
<text x="338" y="250" class="h">Review linked</text>
<text x="338" y="277" class="h">points</text>
<text x="338" y="321" class="b">Source-linked</text>
<text x="338" y="346" class="b">provisions retain</text>
<text x="338" y="371" class="b">exceptions and related</text>
<text x="338" y="396" class="b">clauses.</text>
<text x="560" y="300" font-size="25">→</text>
<rect x="581" y="174" width="237" height="270" rx="15" fill="white" stroke="#cbd7d8"/>
<text x="601" y="211" class="k">03</text>
<text x="601" y="250" class="h">React and</text>
<text x="601" y="277" class="h">clarify</text>
<text x="601" y="321" class="b">Comfortable / Need</text>
<text x="601" y="346" class="b">clarification / Not</text>
<text x="601" y="371" class="b">comfortable. Save</text>
<text x="601" y="396" class="b">questions or concerns.</text>
<text x="823" y="300" font-size="25">→</text>
<rect x="844" y="174" width="237" height="270" rx="15" fill="white" stroke="#cbd7d8"/>
<text x="864" y="211" class="k">04</text>
<text x="864" y="250" class="h">Pause at</text>
<text x="864" y="277" class="h">checkpoints</text>
<text x="864" y="321" class="b">A short group of points</text>
<text x="864" y="346" class="b">makes progress and</text>
<text x="864" y="371" class="b">remaining coverage</text>
<text x="864" y="396" class="b">visible.</text>
<text x="1086" y="300" font-size="25">→</text>
<rect x="1107" y="174" width="237" height="270" rx="15" fill="white" stroke="#cbd7d8"/>
<text x="1127" y="211" class="k">05</text>
<text x="1127" y="250" class="h">Keep a decision</text>
<text x="1127" y="277" class="h">report</text>
<text x="1127" y="321" class="b">Retain concerns,</text>
<text x="1127" y="346" class="b">skipped topics,</text>
<text x="1127" y="371" class="b">unanswered questions,</text>
<text x="1127" y="396" class="b">and source links.</text>
<text x="55" y="501" font-size="17" fill="#52646d">Concept reconstructed from README and pathfinding/vision discussion; not a tested interface.</text>
</svg>